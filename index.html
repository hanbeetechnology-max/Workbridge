
  <!DOCTYPE html>
  <html lang="en">
    <head>

      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" type="image/png" href="/favicon.png" />

      <title>WorkBridge | Freelance Marketplace for Verified Talent</title>
      <meta name="title" content="WorkBridge | Freelance Marketplace for Verified Talent" />
      <meta name="description" content="Post a project, hire verified freelance talent, and pay only once the work is approved — every payment held securely in escrow until you sign off." />
      <meta name="robots" content="index, follow" />

      <!-- Open Graph — how the page unfurls on WhatsApp, LinkedIn, Facebook, etc.
           TODO: og:image points at the square favicon as a stopgap — replace with
           a real 1200x630 social-preview banner once one exists (public/ has no
           such asset yet), or link previews will render an oddly-cropped icon. -->
      <meta property="og:type" content="website" />
      <meta property="og:url" content="https://workbridge.io/" />
      <meta property="og:title" content="WorkBridge | Freelance Marketplace for Verified Talent" />
      <meta property="og:description" content="Post a project, hire verified freelance talent, and pay only once the work is approved — every payment held securely in escrow until you sign off." />
      <meta property="og:image" content="https://workbridge.io/favicon.png" />

      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="WorkBridge | Freelance Marketplace for Verified Talent" />
      <meta name="twitter:description" content="Post a project, hire verified freelance talent, and pay only once the work is approved — every payment held securely in escrow until you sign off." />
      <meta name="twitter:image" content="https://workbridge.io/favicon.png" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script>
        // Applies the .dark class before React even mounts, straight from
        // localStorage/OS preference — without this, the page would flash
        // light-then-dark on every load for a user who's chosen dark mode
        // (see app/context/ThemeContext.jsx, the source of truth this
        // mirrors). Kept deliberately tiny and dependency-free since it
        // runs before any bundle loads.
        (function () {
          try {
            var stored = localStorage.getItem("wb-theme");
            var isDark =
              stored === "dark" ||
              (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            if (isDark) document.documentElement.classList.add("dark");
          } catch (e) {}
        })();
      </script>

    </head>

    <body>

      <div id="root"></div>
      <script type="module" src="/src/main.jsx"></script>

    </body>
  </html>
